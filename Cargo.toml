[package]
name = "epub-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Another Epub Reader — a desktop EPUB reader"
license = "MIT"

[lib]
name = "epub_reader"
path = "src/lib.rs"

[[bin]]
name = "another-epub-reader"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
rbook = { version = "0.7.12", default-features = false, features = ["prelude", "threadsafe"] }
scraper = "0.29.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
image = "0.25.10"
anyhow = "1.0.104"
thiserror = "2.0.21"
encoding_rs = "0.8.44"
sha2 = "0.11.1"
# Recurring timer used by the reader to follow scroll position in the TOC sidebar.
smol = "2.0"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
scraper = "0.29.0"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"


