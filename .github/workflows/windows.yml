name: Windows build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not read version from Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not numeric x.y.z; the MSI builder requires a numeric version."
          }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
            if ($tagVersion -ne $version) {
              throw "Tag version '$tagVersion' does not match Cargo.toml version '$version'. Bump Cargo.toml or retag."
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building Another Epub Reader $version"

      - name: Build release exe
        shell: pwsh
        run: cargo build --release --locked

      - name: Install WiX (MSI) and Inno Setup (setup exe)
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          choco install innosetup -y --no-progress

      - name: Prepare output folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

      - name: Build MSI installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\candle.exe")) {
            $candle = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" | Select-Object -First 1
            if (-not $candle) { throw "WiX candle.exe not found" }
            $wixBin = $candle.DirectoryName
          }
          & "$wixBin\candle.exe" -nologo installer\installer.wxs "-dVersion=$env:APP_VERSION" "-dRepoRoot=$env:GITHUB_WORKSPACE" -ext WixUIExtension -o installer\installer.wixobj
          if ($LASTEXITCODE -ne 0) { throw "candle failed with exit code $LASTEXITCODE" }
          & "$wixBin\light.exe" -nologo installer\installer.wixobj -ext WixUIExtension -cultures:en-us -o "dist\AnotherEpubReader-$env:APP_VERSION-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit code $LASTEXITCODE" }

      - name: Build setup exe (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
            if (-not $found) { throw "Inno Setup ISCC.exe not found" }
            $iscc = $found.FullName
          }
          & $iscc "/DAPP_VERSION=$env:APP_VERSION" "/DSourceRoot=$env:GITHUB_WORKSPACE" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Assemble portable exe and zip
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = "target\release\another-epub-reader.exe"
          if (-not (Test-Path $exe)) { throw "release exe not found at $exe" }
          Copy-Item $exe "dist\AnotherEpubReader-$env:APP_VERSION-x64-portable.exe"

          $portable = Join-Path $env:RUNNER_TEMP "AnotherEpubReader-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $exe $portable
          Copy-Item README.md, LICENSE $portable
          Compress-Archive -Path "$portable\*" -DestinationPath "dist\AnotherEpubReader-$env:APP_VERSION-x64-portable.zip" -Force

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\* -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnotherEpubReader-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
